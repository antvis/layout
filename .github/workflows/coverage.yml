name: Layout Package Coverage

on:
  pull_request:
    paths:
      - 'packages/layout/**' # 仅 layout 包的改动触发
      - '.github/workflows/layout-coverage.yml'

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # 👇 只运行 packages/layout 的测试并生成 coverage
      - name: Run layout tests with coverage
        working-directory: packages/layout
        run: npx jest --coverage

      # 👇 用社区 Action 输出覆盖率评论
      - name: Comment Jest coverage report
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-file: coverage/layout/coverage-summary.json
          title: 🧪 `packages/layout` Coverage
          skip-step: false
