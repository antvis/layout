<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>@antv/layout ESM + Worker demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        line-height: 1.4;
      }
      pre {
        padding: 12px;
        background: #f5f5f5;
        border-radius: 8px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>ESM + WebWorker</h1>
    <p>Open devtools console to see layout results.</p>

    <script type="module">
      import { MDSLayout, Supervisor } from '@antv/layout';

      const data = {
        nodes: Array.from({ length: 10 }).map((_, i) => ({ id: 'n' + i })),
        edges: [
          { source: 'n0', target: 'n1' },
          { source: 'n1', target: 'n2' },
          { source: 'n2', target: 'n3' },
          { source: 'n3', target: 'n4' },
          { source: 'n4', target: 'n5' },
          { source: 'n5', target: 'n0' },
        ],
      };

      const layout = new MDSLayout({ workerEnabled: true });
      const supervisor = new Supervisor(layout, {
        // In dev, let Vite bundle the source worker
        workerScriptURL: new URL('../src/worker.ts', import.meta.url),
      });

      const result = await supervisor.execute(data);
      console.log('ESM worker layout result:', result);
    </script>
  </body>
  </html>
