<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>性能报告可视化 Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f7fa;
        padding: 16px;
        font-size: 14px;
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
      }

      .header {
        background: white;
        padding: 16px 20px;
        border-radius: 8px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header h1 {
        font-size: 20px;
        color: #1a1a1a;
        font-weight: 600;
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .controls label {
        font-size: 13px;
        color: #666;
        font-weight: 500;
      }

      .controls select {
        padding: 6px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        font-size: 13px;
        background: white;
        cursor: pointer;
        transition: border-color 0.3s;
      }

      .controls select:hover {
        border-color: #40a9ff;
      }

      .device-info {
        background: #e6f7ff;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 12px;
        color: #0050b3;
        margin-bottom: 16px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .stat-card {
        background: white;
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .stat-card.warning {
        border-left-color: #faad14;
      }

      .stat-card.danger {
        border-left-color: #f5222d;
      }

      .stat-card .label {
        font-size: 12px;
        color: #8c8c8c;
        margin-bottom: 8px;
      }

      .stat-card .value {
        font-size: 24px;
        font-weight: 600;
        color: #1a1a1a;
      }

      .stat-card .sub {
        font-size: 12px;
        color: #52c41a;
        margin-top: 4px;
      }

      .stat-card.warning .sub {
        color: #faad14;
      }

      .stat-card.danger .sub {
        color: #f5222d;
      }

      .chart-section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        margin-bottom: 16px;
      }

      .chart-title {
        font-size: 16px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px solid #f0f0f0;
      }

      #mainChart {
        width: 100%;
        height: 400px;
      }

      .comparison-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 16px;
      }

      .comparison-card {
        background: white;
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .comparison-card h3 {
        font-size: 14px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid #f0f0f0;
      }

      .comparison-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #f5f5f5;
      }

      .comparison-item:last-child {
        border-bottom: none;
      }

      .comparison-label {
        font-size: 13px;
        color: #595959;
      }

      .comparison-values {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .old-value {
        font-size: 12px;
        color: #8c8c8c;
        text-decoration: line-through;
      }

      .new-value {
        font-size: 14px;
        font-weight: 600;
        color: #1a1a1a;
      }

      .improvement {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 500;
      }

      .improvement.positive {
        background: #f6ffed;
        color: #52c41a;
      }

      .improvement.negative {
        background: #fff1f0;
        color: #f5222d;
      }

      .speedup-badge {
        background: #e6f7ff;
        color: #0050b3;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }

      .status-tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-left: 8px;
      }

      .status-tag.refactored {
        background: #f6ffed;
        color: #52c41a;
        border: 1px solid #b7eb8f;
      }

      .status-tag.not-refactored {
        background: #f5f5f5;
        color: #8c8c8c;
        border: 1px solid #d9d9d9;
      }

      @media (max-width: 768px) {
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .comparison-grid {
          grid-template-columns: 1fr;
        }

        #mainChart {
          height: 300px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>📊 性能报告 Dashboard</h1>
        <div class="controls">
          <label>报告：</label>
          <select id="reportSelect"></select>
          <label>指标：</label>
          <select id="metricSelect">
            <option value="avg">平均耗时</option>
            <option value="median">中位数</option>
            <option value="min">最小耗时</option>
            <option value="max">最大耗时</option>
          </select>
        </div>
      </div>

      <div class="device-info" id="deviceInfo">
        <strong>设备信息：</strong><span id="deviceDetails">加载中...</span>
      </div>

      <div class="comparison-grid" id="comparisonGrid"></div>
    </div>

    <script src="./report-viewer.js"></script>
  </body>
</html>
